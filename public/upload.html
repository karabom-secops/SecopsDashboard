<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Report — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <img class="header-logo-svg" src="img/reflex-logo.png" alt="Reflex logo" />
      <div class="header-brand">
        <span class="brand-secops">SECOPS</span>
      </div>
    </div>
    <div class="header-right">
      <a href="/secops/" class="btn btn-secondary">&#8592; Back to Dashboard</a>
    </div>
  </header>

  <main id="uploadScreen">
    <div class="upload-card">
      <h2>Submit Weekly Report</h2>
      <p class="upload-hint">Paste your plain-text report below, or upload a <code>.txt</code> file. Optionally attach a CSV for org stats.</p>

      <form id="uploadForm" novalidate>
        <div class="form-row">
          <label class="form-label" for="weekDate">Week Commencing</label>
          <input type="date" id="weekDate" name="weekDate" required />
        </div>

        <label class="form-label" for="reportTextarea">Report Text <span class="form-hint">(no need to include the Week Commencing line)</span></label>
        <textarea
          id="reportTextarea"
          name="report"
          rows="14"
          placeholder="Priority 1: ..."
        ></textarea>

        <div class="upload-file-row">
          <div class="file-group">
            <label class="form-label" for="reportFile">Or upload .txt file</label>
            <input type="file" id="reportFile" accept=".txt,text/plain" />
          </div>
          <div class="file-group">
            <label class="form-label" for="csvFile">Org stats CSV (optional)</label>
            <input type="file" id="csvFile" accept=".csv,text/csv" />
          </div>
        </div>

        <div id="uploadError" class="upload-error" hidden></div>

        <button type="submit" id="btnUpload" class="btn btn-primary btn-block">
          <span id="uploadBtnLabel">Parse &amp; Load Dashboard</span>
          <span id="uploadSpinner" class="spinner" hidden></span>
        </button>
      </form>
    </div>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
