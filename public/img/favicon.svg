<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SecOps Dashboard">
  <!--
    The browser-tab mark. SVG rather than .ico on purpose: one file, sharp at
    every size, and no binary asset to regenerate when the brand shifts.
    reflex-logo.png stays the fallback for browsers that will not take SVG.

    The shield is the product (security), the pulse line is what the dashboard
    actually shows (activity over time). Colours are the app's own blue and
    cyan, taken from wazuh-ui.js COLORS.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0066CC"/>
      <stop offset="1" stop-color="#00BADF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <path d="M16 5.5l7.5 3v6.2c0 4.7-3.1 8.9-7.5 10.3-4.4-1.4-7.5-5.6-7.5-10.3V8.5z"
        fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M11.5 15.8h2.6l1.6-3.4 2.1 5.2 1.3-1.8h1.6"
        fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
