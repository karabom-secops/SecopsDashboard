<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Report — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <svg class="header-logo-svg" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rlhu" x1="0" y1="20" x2="44" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0066CC"/><stop offset="1" stop-color="#00BADF"/>
          </linearGradient>
          <linearGradient id="rlvu" x1="22" y1="4" x2="22" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00E5FF"/><stop offset="1" stop-color="#0066CC"/>
          </linearGradient>
        </defs>
        <path d="M17 20 L17 28 A5 5 0 0 1 27 28 L27 20" stroke="url(#rlvu)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <rect x="7" y="15" width="30" height="10" rx="5" stroke="url(#rlhu)" stroke-width="2.8" fill="none"/>
        <rect x="17" y="13" width="10" height="14" fill="white"/>
        <path d="M17 15 Q7 15 7 20 Q7 25 17 25" stroke="url(#rlhu)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <path d="M27 25 Q37 25 37 20 Q37 15 27 15" stroke="url(#rlhu)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <path d="M17 20 L17 12 A5 5 0 0 0 27 12 L27 20" stroke="url(#rlvu)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <text x="46" y="26" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="16" fill="#0066CC" letter-spacing="0.5">reflex</text>
      </svg>
      <div class="header-brand">
        <span class="brand-secops">SECOPS</span>
      </div>
    </div>
    <div class="header-right">
      <a href="/secops/" class="btn btn-secondary">&#8592; Back to Dashboard</a>
    </div>
  </header>

  <main id="uploadScreen">
    <div class="upload-card">
      <h2>Submit Weekly Report</h2>
      <p class="upload-hint">Paste your plain-text report below, or upload a <code>.txt</code> file. Optionally attach a CSV for org stats.</p>

      <form id="uploadForm" novalidate>
        <div class="form-row">
          <label class="form-label" for="weekDate">Week Commencing</label>
          <input type="date" id="weekDate" name="weekDate" required />
        </div>

        <label class="form-label" for="reportTextarea">Report Text <span class="form-hint">(no need to include the Week Commencing line)</span></label>
        <textarea
          id="reportTextarea"
          name="report"
          rows="14"
          placeholder="Priority 1: ..."
        ></textarea>

        <div class="upload-file-row">
          <div class="file-group">
            <label class="form-label" for="reportFile">Or upload .txt file</label>
            <input type="file" id="reportFile" accept=".txt,text/plain" />
          </div>
          <div class="file-group">
            <label class="form-label" for="csvFile">Org stats CSV (optional)</label>
            <input type="file" id="csvFile" accept=".csv,text/csv" />
          </div>
        </div>

        <div id="uploadError" class="upload-error" hidden></div>

        <button type="submit" id="btnUpload" class="btn btn-primary btn-block">
          <span id="uploadBtnLabel">Parse &amp; Load Dashboard</span>
          <span id="uploadSpinner" class="spinner" hidden></span>
        </button>
      </form>
    </div>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
