<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="img/favicon.png" />
  <meta name="theme-color" content="#0066CC" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo-wrap">
      <!-- img/logo.png has never existed; the onerror below was hiding it on
           every page load. The real asset is reflex-logo.png. -->
      <img class="login-logo" src="img/reflex-logo.png" alt="Reflex Solutions" onerror="this.style.display='none'" />
      <span class="login-title">SecOps Dashboard</span>
    </div>

    <form id="login-form" novalidate autocomplete="on">
      <div class="form-group">
        <label class="login-label" for="login-username">Username</label>
        <input
          id="login-username"
          name="username"
          type="text"
          class="login-input"
          autocomplete="username"
          required
          placeholder="Enter username"
        />
      </div>

      <div class="form-group">
        <label class="login-label" for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          class="login-input"
          autocomplete="current-password"
          required
          placeholder="Enter password"
        />
      </div>

      <p id="login-error" class="login-error" hidden></p>

      <button id="login-btn" type="submit" class="btn btn-primary login-btn">
        Sign In
      </button>
    </form>

    <!-- Step 2a: TOTP verify (shown when mfaRequired) -->
    <div id="mfa-step" hidden>
      <h2 class="login-mfa-title">Two-Factor Authentication</h2>
      <p class="login-mfa-hint">Enter the 6-digit code from your authenticator app.</p>
      <div class="form-group">
        <label class="login-label" for="mfa-code">Authenticator Code</label>
        <input id="mfa-code" type="text" inputmode="numeric" maxlength="6"
               pattern="[0-9]{6}" class="login-input" autocomplete="one-time-code"
               placeholder="000000" />
      </div>
      <p id="mfa-error" class="login-error" hidden></p>
      <button id="mfa-btn" type="button" class="btn btn-primary login-btn">Verify</button>
      <button id="mfa-back" type="button" class="btn btn-secondary login-btn-back">← Back to login</button>
    </div>

    <!-- Step 2b: Forced TOTP enrollment (shown when enrollRequired) -->
    <div id="enroll-step" hidden>
      <h2 class="login-mfa-title">Set Up Two-Factor Authentication</h2>
      <p class="login-mfa-hint">Scan the QR code with Google Authenticator, Authy, or any TOTP app.</p>
      <img id="enroll-qr-img" src="" alt="TOTP QR Code" class="enroll-qr" />
      <p class="login-mfa-hint">Or enter this key manually:</p>
      <code id="enroll-secret-text" class="enroll-secret"></code>
      <div class="form-group" style="margin-top:1rem">
        <label class="login-label" for="enroll-code">Confirm 6-digit code</label>
        <input id="enroll-code" type="text" inputmode="numeric" maxlength="6"
               pattern="[0-9]{6}" class="login-input" autocomplete="one-time-code"
               placeholder="000000" />
      </div>
      <p id="enroll-error" class="login-error" hidden></p>
      <button id="enroll-btn" type="button" class="btn btn-primary login-btn">Confirm &amp; Enable</button>
      <button id="enroll-back" type="button" class="btn btn-secondary login-btn-back">← Back to login</button>
    </div>

    <!-- SSO button (shown only when SAML is enabled) -->
    <div id="sso-section" hidden>
      <div class="login-divider"><span>or</span></div>
      <button id="sso-btn" type="button" class="btn btn-secondary login-btn">
        <svg width="18" height="18" viewBox="0 0 21 21" style="margin-right:8px;vertical-align:middle" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </button>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
