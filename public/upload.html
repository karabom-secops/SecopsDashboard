<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Report — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <!-- Reflex interlocked-link logo -->
      <svg class="header-logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="38" height="38" rx="10" fill="#030b14" stroke="#0d2640" stroke-width="1.5"/>
        <defs>
          <linearGradient id="rlhu" x1="6" y1="20" x2="34" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0077b6"/><stop offset="1" stop-color="#00c8e8"/>
          </linearGradient>
          <linearGradient id="rlvu" x1="20" y1="6" x2="20" y2="34" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#0090b0"/>
          </linearGradient>
        </defs>
        <path d="M15 20 L15 29 A5 5 0 0 1 25 29 L25 20" stroke="url(#rlvu)" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="6" y="15" width="28" height="10" rx="5" stroke="url(#rlhu)" stroke-width="2.5"/>
        <rect x="15" y="13.5" width="10" height="13" fill="#030b14"/>
        <path d="M15 15 Q6 15 6 20 Q6 25 15 25" stroke="url(#rlhu)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M25 25 Q34 25 34 20 Q34 15 25 15" stroke="url(#rlhu)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M15 20 L15 11 A5 5 0 0 0 25 11 L25 20" stroke="url(#rlvu)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="header-brand">
        <span class="brand-reflex">reflex</span><span class="brand-secops">SECOPS</span>
      </div>
    </div>
    <div class="header-right">
      <a href="/secops/" class="btn btn-secondary">&#8592; Back to Dashboard</a>
    </div>
  </header>

  <main id="uploadScreen">
    <div class="upload-card">
      <h2>Submit Weekly Report</h2>
      <p class="upload-hint">Paste your plain-text report below, or upload a <code>.txt</code> file. Optionally attach a CSV for org stats.</p>

      <form id="uploadForm" novalidate>
        <div class="form-row">
          <label class="form-label" for="weekDate">Week Commencing</label>
          <input type="date" id="weekDate" name="weekDate" required />
        </div>

        <label class="form-label" for="reportTextarea">Report Text <span class="form-hint">(no need to include the Week Commencing line)</span></label>
        <textarea
          id="reportTextarea"
          name="report"
          rows="14"
          placeholder="Priority 1: ..."
        ></textarea>

        <div class="upload-file-row">
          <div class="file-group">
            <label class="form-label" for="reportFile">Or upload .txt file</label>
            <input type="file" id="reportFile" accept=".txt,text/plain" />
          </div>
          <div class="file-group">
            <label class="form-label" for="csvFile">Org stats CSV (optional)</label>
            <input type="file" id="csvFile" accept=".csv,text/csv" />
          </div>
        </div>

        <div id="uploadError" class="upload-error" hidden></div>

        <button type="submit" id="btnUpload" class="btn btn-primary btn-block">
          <span id="uploadBtnLabel">Parse &amp; Load Dashboard</span>
          <span id="uploadSpinner" class="spinner" hidden></span>
        </button>
      </form>
    </div>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
