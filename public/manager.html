<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Report — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .mgr-page { min-height: 100vh; background: var(--bg, #f0f4f8); display: flex; flex-direction: column; }

    /* Top bar */
    .mgr-topbar {
      background: var(--surface, #fff);
      border-bottom: 1px solid var(--border, #e2e8f0);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .mgr-topbar-logo { height: 32px; }
    .mgr-topbar-title { font-weight: 700; font-size: 1rem; color: var(--text, #1e293b); flex: 1; }
    .mgr-topbar-user  { font-size: 0.85rem; color: var(--muted, #64748b); }
    .mgr-topbar-logout {
      font-size: 0.82rem; color: var(--muted, #64748b); text-decoration: underline;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .mgr-topbar-logout:hover { color: var(--text, #1e293b); }

    /* Content */
    .mgr-content { padding: 1.75rem 2rem; max-width: 1200px; width: 100%; margin: 0 auto; flex: 1; }

    /* Table card */
    .mgr-table-card {
      background: var(--surface, #fff);
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      overflow: hidden;
    }

    /* Controls bar — matches the awareness tab header */
    .mgr-table-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border, #e2e8f0);
      flex-wrap: wrap;
    }
    .mgr-table-title { font-weight: 700; font-size: 1rem; color: var(--text, #1e293b); flex: 1; min-width: 180px; }

    /* Loading / no-data */
    .mgr-state { padding: 3rem 1.5rem; text-align: center; color: var(--muted, #64748b); font-size: 0.9rem; }
  </style>
</head>
<body class="mgr-page">

  <!-- Top bar -->
  <div class="mgr-topbar">
    <img class="mgr-topbar-logo" src="img/logo.png" alt="Reflex" onerror="this.style.display='none'" />
    <span class="mgr-topbar-title">Security Awareness</span>
    <span class="mgr-topbar-user">Signed in as <strong id="mgrUsername">…</strong></span>
    <button class="mgr-topbar-logout" id="mgrLogoutBtn">Sign out</button>
  </div>

  <!-- Main content -->
  <div class="mgr-content">
    <div class="mgr-table-card">

      <!-- Controls header -->
      <div class="mgr-table-header">
        <span class="mgr-table-title">Employee Training Completion</span>

        <input
          id="mgrSearch"
          type="search"
          class="search-input"
          placeholder="Search by name or email…"
          autocomplete="off"
          hidden
        />

        <button id="mgrExportCsvBtn"  class="btn btn-secondary btn-sm" hidden>&#8595; Export CSV</button>
        <button id="mgrExportLowBtn"  class="btn btn-secondary btn-sm" hidden>&#8595; Export &lt;70% Users</button>
        <button id="mgrReportBtn"     class="btn btn-secondary btn-sm" hidden>&#128203; Manager Report</button>
      </div>

      <!-- Loading state -->
      <div class="mgr-state" id="mgrLoading">Loading awareness data…</div>

      <!-- No-data state -->
      <div class="mgr-state" id="mgrNoData" hidden></div>

      <!-- Table — identical structure to awarenessUserCompletionTable -->
      <div id="mgrTableWrap" hidden>
        <table class="data-table" id="mgrTable" style="width:100%">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Manager</th>
              <th class="col-num">Assigned</th>
              <th class="col-num">Completed</th>
              <th class="col-num">%</th>
              <th class="col-num">Missing</th>
            </tr>
          </thead>
          <tbody id="mgrTableBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="js/tab-awareness.js"></script>
  <script>
    (function () {
      'use strict';

      var BASE = (function () {
        var base = document.querySelector('base');
        return base ? base.href : '/';
      })();

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      var _rows = [];

      function renderTable(term) {
        var tbody  = document.getElementById('mgrTableBody');
        if (!tbody) return;

        var lc = (term || '').trim().toLowerCase();
        var filtered = lc
          ? _rows.filter(function (r) {
              return (r.name.toLowerCase().indexOf(lc) !== -1) ||
                     (r.email.toLowerCase().indexOf(lc) !== -1);
            })
          : _rows;

        var html = '';
        filtered.forEach(function (r, i) {
          var pct      = r.assigned > 0 ? Math.round(r.completed / r.assigned * 100) : 0;
          var pctClass = pct >= 80 ? 'accent-green' : pct >= 50 ? 'accent-amber' : 'accent-red';
          var detailId  = 'mgr-detail-' + i;
          var missCount = r.missing.length;

          html += '<tr>' +
            '<td>' + esc(r.name) + '</td>' +
            '<td><small>' + esc(r.email) + '</small></td>' +
            '<td>' + esc(r.manager) + '</td>' +
            '<td class="col-num">' + esc(String(r.assigned)) + '</td>' +
            '<td class="col-num">' + esc(String(r.completed)) + '</td>' +
            '<td class="col-num"><strong class="' + esc(pctClass) + '">' + esc(String(pct)) + '%</strong></td>' +
            '<td class="col-num">' +
              (missCount > 0
                ? '<button class="btn-link awareness-missing-toggle" data-target="' + esc(detailId) + '" aria-expanded="false">&#9654; ' + esc(String(missCount)) + '</button>'
                : '<span class="muted">—</span>') +
            '</td>' +
            '</tr>';

          if (missCount > 0) {
            var items = r.missing.map(function (m) {
              var dateStr = m.date
                ? new Date(m.date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' })
                : '';
              var typeTag = m.type === 'Quiz'
                ? '<span class="badge badge-amber">Quiz</span>'
                : m.type === 'Phishing Remediation Session'
                  ? '<span class="badge badge-red">Phishing Remediation</span>'
                  : '<span class="badge badge-blue">Awareness</span>';
              return '<li>' + typeTag + ' ' + esc(m.title) +
                (dateStr ? ' <span class="muted">(' + esc(dateStr) + ')</span>' : '') + '</li>';
            }).join('');

            html += '<tr id="' + esc(detailId) + '" class="awareness-missing-detail" hidden>' +
              '<td colspan="7" style="padding:0.5rem 1rem 0.75rem 2rem;background:var(--surface-alt,#f5f6f8)">' +
              '<ul class="awareness-missing-list">' + items + '</ul>' +
              '</td></tr>';
          }
        });

        tbody.innerHTML = html;

        // Expand/collapse missing rows
        tbody.addEventListener('click', function (e) {
          var btn = e.target.closest('.awareness-missing-toggle');
          if (!btn) return;
          var detailRow = document.getElementById(btn.getAttribute('data-target'));
          if (!detailRow) return;
          var expanded = btn.getAttribute('aria-expanded') === 'true';
          detailRow.hidden = expanded;
          btn.setAttribute('aria-expanded', String(!expanded));
          btn.innerHTML = (expanded ? '&#9654; ' : '&#9660; ') + esc(String(detailRow.querySelectorAll('li').length));
        });
      }

      async function init() {
        var res;
        try {
          res = await fetch(BASE + 'api/auth/me', { credentials: 'same-origin' });
        } catch (_) { location.replace(BASE + 'login.html'); return; }
        if (!res.ok) { location.replace(BASE + 'login.html'); return; }

        var user = await res.json();
        if (!['manager', 'admin', 'superadmin'].includes(user.role)) {
          location.replace(BASE + 'login.html');
          return;
        }

        document.getElementById('mgrUsername').textContent = user.username;

        // Logout
        document.getElementById('mgrLogoutBtn').addEventListener('click', async function () {
          try { await fetch(BASE + 'api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
          location.replace(BASE + 'login.html');
        });

        // Load data
        var rows;
        try {
          rows = await window.getAwarenessRows();
        } catch (err) {
          document.getElementById('mgrLoading').hidden = true;
          var nd = document.getElementById('mgrNoData');
          nd.textContent = err.message || 'Could not load awareness data.';
          nd.hidden = false;
          return;
        }

        _rows = rows;
        document.getElementById('mgrLoading').hidden  = true;
        document.getElementById('mgrTableWrap').hidden = false;

        // Show controls
        document.getElementById('mgrSearch').hidden     = false;
        document.getElementById('mgrExportCsvBtn').hidden = false;
        document.getElementById('mgrExportLowBtn').hidden = false;
        document.getElementById('mgrReportBtn').hidden    = false;

        renderTable('');

        // Live search
        var searchEl = document.getElementById('mgrSearch');
        searchEl.addEventListener('input', function () {
          renderTable(searchEl.value);
        });

        // Export CSV
        document.getElementById('mgrExportCsvBtn').addEventListener('click', function () {
          var csvRows = [['Name', 'Email', 'Manager', 'Assigned', 'Completed', '%']];
          _rows.forEach(function (r) {
            var pct = r.assigned > 0 ? Math.round(r.completed / r.assigned * 100) : 0;
            csvRows.push([r.name, r.email, r.manager, r.assigned, r.completed, pct + '%']);
          });
          var csv = csvRows.map(function (row) {
            return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
          }).join('\n');
          var blob = new Blob([csv], { type: 'text/csv' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'awareness-completion.csv';
          a.click();
        });

        // Export <70%
        document.getElementById('mgrExportLowBtn').addEventListener('click', function () {
          var lowRows = _rows.filter(function (r) {
            return r.assigned > 0 && Math.round(r.completed / r.assigned * 100) < 70;
          });
          var csvRows = [['Name', 'Email', 'Manager', 'Assigned', 'Completed', '%', 'Missing Sessions']];
          lowRows.forEach(function (r) {
            var pct     = Math.round(r.completed / r.assigned * 100);
            var missing = r.missing.map(function (m) { return m.title || m.type; }).join('; ');
            csvRows.push([r.name, r.email, r.manager, r.assigned, r.completed, pct + '%', missing]);
          });
          var csv = csvRows.map(function (row) {
            return row.map(function (v) { return '"' + String(v ?? '').replace(/"/g, '""') + '"'; }).join(',');
          }).join('\r\n');
          var blob = new Blob([csv], { type: 'text/csv' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'awareness-below-70pct.csv';
          a.click();
          URL.revokeObjectURL(a.href);
        });

        // Manager Report popup
        var reportBtn = document.getElementById('mgrReportBtn');
        reportBtn.addEventListener('click', function () {
          reportBtn.disabled = true;
          window.generateManagerReport(_rows).finally(function () {
            reportBtn.disabled = false;
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
