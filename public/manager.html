<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Report — SecOps Dashboard</title>
  <base href="/secops/" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Layout ── */
    .mgr-page { min-height: 100vh; background: var(--bg, #f0f4f8); display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .mgr-topbar {
      background: var(--surface, #fff);
      border-bottom: 1px solid var(--border, #e2e8f0);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .mgr-topbar-logo { height: 32px; }
    .mgr-topbar-title { font-weight: 700; font-size: 1rem; color: var(--text, #1e293b); flex: 1; }
    .mgr-topbar-user { font-size: 0.85rem; color: var(--muted, #64748b); }
    .mgr-topbar-logout {
      font-size: 0.82rem; color: var(--muted, #64748b); text-decoration: underline;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .mgr-topbar-logout:hover { color: var(--text, #1e293b); }

    /* ── Content ── */
    .mgr-content { padding: 1.75rem 2rem; max-width: 1100px; width: 100%; margin: 0 auto; flex: 1; }

    /* ── Stat summary strip ── */
    .mgr-stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .mgr-stat {
      background: var(--surface, #fff);
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      padding: 0.9rem 1.25rem;
      min-width: 140px;
      flex: 1;
    }
    .mgr-stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text, #1e293b); line-height: 1; }
    .mgr-stat-label { font-size: 0.75rem; color: var(--muted, #64748b); margin-top: 0.25rem; }
    .mgr-stat.green .mgr-stat-value { color: #15803d; }
    .mgr-stat.red   .mgr-stat-value { color: #dc2626; }
    .mgr-stat.amber .mgr-stat-value { color: #d97706; }

    /* ── Controls bar ── */
    .mgr-controls {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .mgr-search {
      flex: 1; min-width: 220px; max-width: 380px;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--surface, #fff);
      color: var(--text, #1e293b);
      outline: none;
    }
    .mgr-search:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
    .mgr-filter-btns { display: flex; gap: 0.4rem; }
    .mgr-filter-btn {
      padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600;
      border: 1px solid var(--border, #e2e8f0); background: var(--surface, #fff);
      color: var(--muted, #64748b); cursor: pointer; transition: all 0.12s;
    }
    .mgr-filter-btn:hover, .mgr-filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .mgr-filter-btn.danger.active { background: #dc2626; border-color: #dc2626; }
    .btn-report {
      margin-left: auto;
      padding: 0.55rem 1.2rem;
      background: #1565C0; color: #fff; border: none; border-radius: 8px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-report:hover { background: #0d47a1; }
    .btn-report:disabled { background: #90a4ae; cursor: not-allowed; }

    /* ── Table ── */
    .mgr-table-wrap {
      background: var(--surface, #fff);
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      overflow: hidden;
    }
    .mgr-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .mgr-table th {
      padding: 0.65rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted, #64748b); background: var(--surface-alt, #f8fafc);
      border-bottom: 1px solid var(--border, #e2e8f0);
    }
    .mgr-table th.col-num { text-align: center; }
    .mgr-table td { padding: 0.65rem 1rem; border-bottom: 1px solid var(--border, #e2e8f0); vertical-align: middle; }
    .mgr-table td.col-num { text-align: center; }
    .mgr-table tbody tr:last-child td { border-bottom: none; }
    .mgr-table tbody tr:hover { background: var(--surface-alt, #f8fafc); }
    .mgr-pct-badge {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 700; min-width: 44px; text-align: center;
    }
    .pct-green { background: #dcfce7; color: #15803d; }
    .pct-amber { background: #fef9c3; color: #92400e; }
    .pct-red   { background: #fee2e2; color: #dc2626; }
    .mgr-empty { padding: 3rem 1rem; text-align: center; color: var(--muted, #64748b); font-size: 0.9rem; }
    .mgr-loading { padding: 2rem 1rem; text-align: center; color: var(--muted, #64748b); }
    .mgr-no-data {
      background: var(--surface, #fff); border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      padding: 2.5rem 2rem; text-align: center; color: var(--muted, #64748b);
    }
    .mgr-email { font-size: 0.78rem; color: var(--muted, #64748b); }
    .mgr-complete-tick { color: #15803d; font-weight: 700; }
  </style>
</head>
<body class="mgr-page">

  <!-- Top bar -->
  <div class="mgr-topbar">
    <img class="mgr-topbar-logo" src="img/logo.png" alt="Reflex" onerror="this.style.display='none'" />
    <span class="mgr-topbar-title">Security Awareness</span>
    <span class="mgr-topbar-user">Signed in as <strong id="mgrUsername">…</strong></span>
    <button class="mgr-topbar-logout" id="mgrLogoutBtn">Sign out</button>
  </div>

  <!-- Main content -->
  <div class="mgr-content">

    <!-- Stat strip (hidden until data loads) -->
    <div class="mgr-stats" id="mgrStats" hidden>
      <div class="mgr-stat">
        <div class="mgr-stat-value" id="statTotal">—</div>
        <div class="mgr-stat-label">Total Team Members</div>
      </div>
      <div class="mgr-stat green">
        <div class="mgr-stat-value" id="statCompliant">—</div>
        <div class="mgr-stat-label">At or Above 70%</div>
      </div>
      <div class="mgr-stat red">
        <div class="mgr-stat-value" id="statNonCompliant">—</div>
        <div class="mgr-stat-label">Below 70%</div>
      </div>
      <div class="mgr-stat amber">
        <div class="mgr-stat-value" id="statAvgPct">—</div>
        <div class="mgr-stat-label">Average Completion</div>
      </div>
    </div>

    <!-- Controls (hidden until data loads) -->
    <div class="mgr-controls" id="mgrControls" hidden>
      <input
        class="mgr-search"
        id="mgrSearch"
        type="search"
        placeholder="Search by name or email…"
        autocomplete="off"
      />
      <div class="mgr-filter-btns">
        <button class="mgr-filter-btn active" data-filter="all">All</button>
        <button class="mgr-filter-btn" data-filter="compliant">≥ 70%</button>
        <button class="mgr-filter-btn danger" data-filter="non-compliant">Below 70%</button>
      </div>
      <button class="btn-report" id="mgrReportBtn">Print Manager Report</button>
    </div>

    <!-- Loading state -->
    <div class="mgr-table-wrap" id="mgrLoading">
      <div class="mgr-loading">Loading awareness data…</div>
    </div>

    <!-- No-data state (hidden by default) -->
    <div class="mgr-no-data" id="mgrNoData" hidden>
      No awareness data has been uploaded yet. Please contact your administrator.
    </div>

    <!-- Team table -->
    <div class="mgr-table-wrap" id="mgrTableWrap" hidden>
      <table class="mgr-table" id="mgrTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th class="col-num">Assigned</th>
            <th class="col-num">Completed</th>
            <th class="col-num">Completion %</th>
            <th class="col-num">Status</th>
          </tr>
        </thead>
        <tbody id="mgrTableBody"></tbody>
      </table>
      <div class="mgr-empty" id="mgrEmpty" hidden>No team members match your search.</div>
    </div>

  </div>

  <script src="js/tab-awareness.js"></script>
  <script>
    (function () {
      'use strict';

      var BASE = (function () {
        var base = document.querySelector('base');
        return base ? base.href : '/';
      })();

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      var _allRows = [];
      var _activeFilter = 'all';

      function pctClass(pct) {
        return pct >= 70 ? 'pct-green' : pct >= 50 ? 'pct-amber' : 'pct-red';
      }

      function renderTable(term, filter) {
        var tbody  = document.getElementById('mgrTableBody');
        var empty  = document.getElementById('mgrEmpty');
        if (!tbody) return;

        var lc = (term || '').trim().toLowerCase();
        var filtered = _allRows.filter(function (r) {
          var pct = r.assigned > 0 ? Math.round(r.completed / r.assigned * 100) : 0;
          if (filter === 'compliant'     && pct < 70)  return false;
          if (filter === 'non-compliant' && pct >= 70) return false;
          if (!lc) return true;
          return (r.name.toLowerCase().indexOf(lc) !== -1) ||
                 (r.email.toLowerCase().indexOf(lc) !== -1);
        });

        if (filtered.length === 0) {
          tbody.innerHTML = '';
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        tbody.innerHTML = filtered.map(function (r) {
          var pct    = r.assigned > 0 ? Math.round(r.completed / r.assigned * 100) : 0;
          var cls    = pctClass(pct);
          var status = pct >= 70
            ? '<span class="mgr-pct-badge pct-green mgr-complete-tick">&#10003; Compliant</span>'
            : '<span class="mgr-pct-badge pct-red">Non-compliant</span>';
          return '<tr>' +
            '<td>' + esc(r.name || r.email) + '</td>' +
            '<td><span class="mgr-email">' + esc(r.email) + '</span></td>' +
            '<td class="col-num">' + esc(String(r.assigned)) + '</td>' +
            '<td class="col-num">' + esc(String(r.completed)) + '</td>' +
            '<td class="col-num"><span class="mgr-pct-badge ' + cls + '">' + esc(String(pct)) + '%</span></td>' +
            '<td class="col-num">' + status + '</td>' +
            '</tr>';
        }).join('');
      }

      function updateStats(rows) {
        var total   = rows.length;
        var compli  = rows.filter(function (r) {
          return r.assigned > 0 && Math.round(r.completed / r.assigned * 100) >= 70;
        }).length;
        var avgPct  = total > 0
          ? Math.round(rows.reduce(function (s, r) {
              return s + (r.assigned > 0 ? r.completed / r.assigned * 100 : 0);
            }, 0) / total)
          : 0;

        document.getElementById('statTotal').textContent        = total;
        document.getElementById('statCompliant').textContent    = compli;
        document.getElementById('statNonCompliant').textContent = total - compli;
        document.getElementById('statAvgPct').textContent       = avgPct + '%';
        document.getElementById('mgrStats').hidden = false;
      }

      async function init() {
        var res;
        try {
          res = await fetch(BASE + 'api/auth/me', { credentials: 'same-origin' });
        } catch (_) { location.replace(BASE + 'login.html'); return; }

        if (!res.ok) { location.replace(BASE + 'login.html'); return; }

        var user = await res.json();
        if (!['manager', 'admin', 'superadmin'].includes(user.role)) {
          location.replace(BASE + 'login.html');
          return;
        }

        var usernameEl = document.getElementById('mgrUsername');
        if (usernameEl) usernameEl.textContent = user.username;

        // Logout
        document.getElementById('mgrLogoutBtn').addEventListener('click', async function () {
          try { await fetch(BASE + 'api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
          location.replace(BASE + 'login.html');
        });

        // Load awareness data
        var rows;
        try {
          rows = await window.getAwarenessRows();
        } catch (err) {
          document.getElementById('mgrLoading').hidden = true;
          document.getElementById('mgrNoData').hidden  = false;
          document.getElementById('mgrNoData').textContent = err.message || 'Could not load awareness data.';
          return;
        }

        _allRows = rows;
        document.getElementById('mgrLoading').hidden   = true;
        document.getElementById('mgrTableWrap').hidden = false;
        document.getElementById('mgrControls').hidden  = false;
        updateStats(rows);
        renderTable('', 'all');

        // Search
        var searchEl = document.getElementById('mgrSearch');
        searchEl.addEventListener('input', function () {
          renderTable(searchEl.value, _activeFilter);
        });

        // Filter buttons
        document.querySelectorAll('.mgr-filter-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.mgr-filter-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            _activeFilter = btn.getAttribute('data-filter');
            renderTable(searchEl.value, _activeFilter);
          });
        });

        // Print report button — reuse already-fetched rows
        var reportBtn = document.getElementById('mgrReportBtn');
        reportBtn.addEventListener('click', function () {
          reportBtn.disabled = true;
          reportBtn.textContent = 'Generating…';
          window.generateManagerReport(_allRows).finally(function () {
            reportBtn.disabled = false;
            reportBtn.textContent = 'Print Manager Report';
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
